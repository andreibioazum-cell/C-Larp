name: Build Cubic Battle 4 (Pure C)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-android:
    name: Build Android APK (Android 8-15)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify pure-C project layout
        run: |
          set -euo pipefail
          test -f src/game/game.c
          test -d src/engine
          test -d src/platform/android
          test -d assets/textures
          test -d assets/audio
          test -d platform/android
          test ! -e game
          test ! -e native
          grep -q 'android:name="com.cb4.GameActivity"' platform/android/AndroidManifest.xml
          grep -q 'android:value="cb_game"' platform/android/AndroidManifest.xml
          grep -q 'android:versionCode="[0-9]\+"' platform/android/AndroidManifest.xml
          grep -q '^package com.cb4;' platform/android/java/com/cb4/GameActivity.java
          grep -q 'Java_com_cb4_GameActivity_nativeReplaceText' src/platform/android/keyboard.inc
          if find . -type f -name '*.ds' -print -quit | grep -q .; then
            echo "::error::The C port must not contain script sources"
            exit 1
          fi

      - name: Check native game sources
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Isrc -I. -Itools/host_test/stub -fsyntax-only src/game/game.c
          python3 tools/check_game_file_size.py
          python3 tools/test_resources.py
          python3 tools/test_game_state.py
          python3 tools/test_settings_storage.py
          python3 tools/test_cloud_progress.py
          python3 tools/test_promo.py

      - name: Setup Java for Android build tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        env:
          CB4_P12_BASE64: ${{ secrets.CB4_P12_BASE64 }}
          CB4_P12_PASSWORD: ${{ secrets.CB4_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$RUNNER_TEMP/cb4-signing"
          mkdir -p "$KEY_DIR"
          if [[ -n "$CB4_P12_BASE64" && -n "$CB4_P12_PASSWORD" ]]; then
            printf '%s' "$CB4_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEY_DIR/CB4.p12"
            chmod 600 "$KEY_DIR/CB4.p12"
            keytool -list -storetype PKCS12 -keystore "$KEY_DIR/CB4.p12" \
              -storepass:env CB4_P12_PASSWORD > /dev/null
            echo "Using release signing key"
          else
            keytool -genkeypair -v \
              -keystore "$KEY_DIR/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Cubic Battle,C=DE"
            echo "Release secrets are absent; using a temporary debug key"
          fi

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            TMP="$(mktemp -d)"
            curl -fsSL -o "$TMP/tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$TMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$TMP"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Stage assets
        run: python3 stage_assets.py assets staging/assets

      - name: Build native libraries
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"
          SOURCES=(src/game/game.c src/engine/runtime.c src/platform/android/android_main.c "$GLUE/android_native_app_glue.c")
          COMMON=(-std=c99 -O3 -s -fPIC -shared -Isrc -I. -I"$GLUE" -landroid -llog -ldl -lm -lvulkan)
          mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/lib/x86_64
          "$TOOLCHAIN/aarch64-linux-android26-clang" "${SOURCES[@]}" "${COMMON[@]}" \
            -o staging/lib/arm64-v8a/libcb_game.so
          "$TOOLCHAIN/armv7a-linux-androideabi26-clang" "${SOURCES[@]}" "${COMMON[@]}" \
            -o staging/lib/armeabi-v7a/libcb_game.so
          "$TOOLCHAIN/x86_64-linux-android26-clang" "${SOURCES[@]}" "${COMMON[@]}" \
            -o staging/lib/x86_64/libcb_game.so

      - name: Package and align APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" package -f \
            -M platform/android/AndroidManifest.xml \
            -S platform/android/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -F unsigned.apk ./staging/
          "$BT/zipalign" -v 4 unsigned.apk aligned.apk

      - name: Sign APK
        env:
          CB4_P12_PASSWORD: ${{ secrets.CB4_P12_PASSWORD }}
          CB4_KEY_ALIAS: ${{ secrets.CB4_KEY_ALIAS }}
          CB4_KEY_PASSWORD: ${{ secrets.CB4_KEY_PASSWORD || secrets.CB4_P12_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          KEY_DIR="$RUNNER_TEMP/cb4-signing"
          if [[ -f "$KEY_DIR/CB4.p12" ]]; then
            SIGN_ARGS=(--ks "$KEY_DIR/CB4.p12" --ks-type PKCS12 \
                       --ks-pass env:CB4_P12_PASSWORD --key-pass env:CB4_KEY_PASSWORD)
            if [[ -n "$CB4_KEY_ALIAS" ]]; then SIGN_ARGS+=(--ks-key-alias "$CB4_KEY_ALIAS"); fi
          else
            SIGN_ARGS=(--ks "$KEY_DIR/debug.keystore" --ks-type JKS \
                       --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android)
          fi
          "$BT/apksigner" sign "${SIGN_ARGS[@]}" --out Game.apk aligned.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging Game.apk | head -n 5
          "$BT/apksigner" verify --verbose --print-certs Game.apk

      - name: Delete temporary signing key
        if: ${{ always() }}
        run: rm -rf -- "${RUNNER_TEMP:?}/cb4-signing"

      - uses: actions/upload-artifact@v4
        with:
          name: Cubic-Battle-4-Full-C-APK
          path: Game.apk
          if-no-files-found: error
